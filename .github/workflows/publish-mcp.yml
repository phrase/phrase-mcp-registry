name: Publish to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - "server.json"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for github-oidc verification
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Login via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Validate
        run: mcp-publisher validate server.json

      - name: Publish
        run: mcp-publisher publish server.json
